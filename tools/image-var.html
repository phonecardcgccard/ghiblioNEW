<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Variation - Ghiblio</title>
  <meta name="description" content="Upload an image and let AI generate creative artistic variations.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script type="module" src="../assets/js/image-var.js"></script>
</head>
<body>
  <nav>
    <a href="../index.html">Home</a>
    <a href="../gallery.html">Gallery</a>
    <a href="../about.html">About</a>
    <a href="../faq.html">FAQ</a>
  </nav>
  <header>
    <h1>Image Variation</h1>
    <p>Upload an image and let AI generate creative artistic variations!</p>
  </header>
  <main>
    <section>
      <form id="image-var-form" autocomplete="off" enctype="multipart/form-data">
        <label for="input-image">Select your image:</label>
        <input type="file" id="input-image" name="input-image" accept="image/*" required>
        <button type="submit" class="btn">Generate Variations</button>
      </form>
      <div id="result" style="display:none; margin-top:2rem;">
        <h2>Your Variations:</h2>
        <div id="variation-list" style="display:flex;flex-wrap:wrap;gap:1rem;"></div>
        <div style="margin-top:1rem;">
          <button id="download-all-btn" class="btn">Download All</button>
        </div>
      </div>
    </section>
  </main>
  <footer>
    <p>© 2025 Ghiblio. All rights reserved.</p>
  </footer>
  <div class="loading" style="display:none;">Generating...</div>
</body>
</html>
