<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Image Enhancement - Ghiblio</title>
  <meta name="description" content="Enhance your images and illustrations with AI for sharper, more vivid results.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../assets/css/style.css">
  <script type="module" src="../assets/js/image-enhance.js"></script>
</head>
<body>
  <nav>
    <a href="../index.html">Home</a>
    <a href="../gallery.html">Gallery</a>
    <a href="../about.html">About</a>
    <a href="../faq.html">FAQ</a>
  </nav>
  <header>
    <h1>Image Enhancement</h1>
    <p>Enhance your photos and illustrations with AI for sharper and more vivid results!</p>
  </header>
  <main>
    <section>
      <form id="image-enhance-form" autocomplete="off" enctype="multipart/form-data">
        <label for="enhance-image">Select an image to enhance:</label>
        <input type="file" id="enhance-image" name="enhance-image" accept="image/*" required>
        <button type="submit" class="btn">Enhance Image</button>
      </form>
      <div id="result" style="display:none; margin-top:2rem;">
        <h2>Enhanced Image:</h2>
        <img id="enhanced-img" src="" alt="Enhanced artwork" style="max-width:100%;border-radius:14px;box-shadow:0 2px 8px #8882;">
        <div style="margin-top:1rem;">
          <button id="download-btn" class="btn">Download</button>
        </div>
      </div>
    </section>
  </main>
  <footer>
    <p>© 2025 Ghiblio. All rights reserved.</p>
  </footer>
  <div class="loading" style="display:none;">Enhancing...</div>
</body>
</html>
